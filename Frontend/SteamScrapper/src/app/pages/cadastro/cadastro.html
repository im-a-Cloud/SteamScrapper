<div class="cadastro-container">
  <h1>Tela de cadastro</h1>

  <form method="post" (ngSubmit)="cadastrarUsuario()" novalidate>    <label for="nome">Nome:</label>
    <input
      type="text"
      id="nome"
      name="nome"
      [(ngModel)]="novoUsuario.nome"
      required>

    <label for="email">Email:</label>
    <input
      type="email"
      id="email"
      name="email"
      [(ngModel)]="novoUsuario.email"
      required>

    <label for="linkSteam">Link perfil da Steam:</label>
    <input
      type="url"
      id="linkSteam"
      name="linkSteam"
      [(ngModel)]="novoUsuario.linkSteam"
      required>

    <label for="senha">Senha:</label>
    <input
      type="password"
      id="senha"
      name="senha"
      [(ngModel)]="novoUsuario.senha"
      required>

    <label for="confirmarSenha">Confirmar Senha:</label>
    <input
      type="password"
      id="confirmarSenha"
      name="confirmarSenha"
      [(ngModel)]="confirmarSenha"
      required>

    <button type="submit">Cadastrar</button>
  </form>

  <div *ngIf="mensagem" class="mensagem" [class]="tipoMensagem">
    {{ mensagem }}
  </div>
<button type="button" (click)="cadastrarUsuario()">Cadastrar 2</button>
  <p class="link">
    Já tem conta?
    <a routerLink="/login">Faça login</a>
  </p>

</div>
  <button type="button" (click)="buceta()">teste</button>
